server:
  port: ${CATALOG_SERVICE_PORT:8085}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

openapi:
  title: River Park Catalog Service API
  description: "Catalog API for River Park: room categories, photos, services and stay rules."
  version: 1.0.0

jwt:
  secret-key: ${JWT_SECRET_KEY:river-park-local-dev-secret-key-32}
  lifetime: ${JWT_LIFETIME:86400000}
  refresh-lifetime: ${JWT_REFRESH_LIFETIME:2592000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}

spring:
  application:
    name: catalog-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${CATALOG_SERVICE_DB_URL:jdbc:postgresql://localhost:${POSTGRES_CATALOG_SERVICE_PORT:5437}/${POSTGRES_CATALOG_SERVICE_DB:catalogdb}}
    username: ${POSTGRES_CATALOG_SERVICE_USER}
    password: ${POSTGRES_CATALOG_SERVICE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: ${CATALOG_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/changelog-master.yaml
    default-schema: public
    liquibase-schema: public

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${CATALOG_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  data:
    redis:
      host: ${CATALOG_SERVICE_REDIS_HOST:localhost}
      port: ${CATALOG_SERVICE_REDIS_PORT:${REDIS_CATALOG_SERVICE_PORT:6381}}
      database: ${CATALOG_SERVICE_REDIS_DB:1}
      timeout: ${CATALOG_SERVICE_REDIS_TIMEOUT:2s}

  cache:
    type: redis

logging:
  structured:
    json:
      customizer:
        - ru.haritonenko.commonlibs.observability.PiiMaskingStructuredLoggingJsonMembersCustomizer
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
  level:
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_ORG_HIBERNATE_BIND:TRACE}

app:
  security:
    internal-service:
      token: ${INTERNAL_SERVICE_TOKEN:}
  data-retention:
    catalog-change-history: ${CATALOG_CHANGE_HISTORY_RETENTION:365d}
  rate-limit:
    enabled: ${CATALOG_RATE_LIMIT_ENABLED:true}
    window: ${CATALOG_RATE_LIMIT_WINDOW:1m}
    max-requests-per-window: ${CATALOG_RATE_LIMIT_MAX_REQUESTS_PER_WINDOW:60}
    max-search-requests-per-window: ${CATALOG_RATE_LIMIT_MAX_SEARCH_REQUESTS_PER_WINDOW:30}

  roomCategory:
    default-page-size: ${CATALOG_ROOM_CATEGORY_DEFAULT_PAGE_SIZE:5}
    default-page-number: ${CATALOG_ROOM_CATEGORY_DEFAULT_PAGE_NUMBER:0}

  services:
    default-page-size: ${CATALOG_SERVICES_DEFAULT_PAGE_SIZE:5}
    default-page-number: ${CATALOG_SERVICES_DEFAULT_PAGE_NUMBER:0}

  cache:
    default-ttl: ${CATEGORY_SERVICE_CACHE_DEFAULT_TTL:30s}
    categories-ttl: ${CATEGORY_SERVICE_CACHE_CATEGORIES_TTL:30s}
    services-ttl: ${CATEGORY_SERVICE_CACHE_SERVICES_TTL:30s}
    photos-ttl: ${CATEGORY_SERVICE_CACHE_PHOTOS_TTL:24h}
  base-dir: ${APP_BASE_DIR:./data/static}
  public-base-url: ${CATALOG_PUBLIC_BASE_URL:http://localhost:8085}
