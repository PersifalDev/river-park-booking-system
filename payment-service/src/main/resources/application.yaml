spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5438/payment_db}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml

  data:
    redis:
      host: ${PAYMENT_SERVICE_REDIS_HOST:${CATALOG_SERVICE_REDIS_HOST:${REDIS_HOST:localhost}}}
      port: ${PAYMENT_SERVICE_REDIS_PORT:${REDIS_CATALOG_SERVICE_PORT:${REDIS_PORT:6381}}}
      database: ${PAYMENT_SERVICE_REDIS_DB:4}
      timeout: ${PAYMENT_SERVICE_REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_HOST_PORT:9094}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${PAYMENT_SERVER_PORT:8087}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

openapi:
  title: River Park Payment Service API
  description: API учебной оплаты River Park без эквайринга.
  version: 1.0.0
  security-scheme-name: bearerAuth

jwt:
  secret-key: ${JWT_SECRET_KEY:river-park-local-dev-secret-key-32}
  lifetime: ${JWT_LIFETIME:86400000}
  refresh-lifetime: ${JWT_REFRESH_LIFETIME:2592000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://alloy:4318/v1/metrics}
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}

app:
  security:
    internal-service:
      token: ${INTERNAL_SERVICE_TOKEN:}
  data-retention:
    payment-records: ${PAYMENT_RECORD_RETENTION:1825d}
  payment:
    work-mode: ${WORK_MODE:ASYNC}
    default-page-size: ${PAYMENT_DEFAULT_PAGE_SIZE:10}
    default-page-number: ${PAYMENT_DEFAULT_PAGE_NUMBER:0}
    events:
      source: ${PAYMENT_EVENT_SOURCE:payment-service}
    lock:
      wait-time: ${PAYMENT_LOCK_WAIT_TIME:3s}
      lease-time: ${PAYMENT_LOCK_LEASE_TIME:30s}
      watchdog-enabled: ${PAYMENT_LOCK_WATCHDOG_ENABLED:true}
      renew-interval: ${PAYMENT_LOCK_RENEW_INTERVAL:10s}
    outbox:
      enabled: ${PAYMENT_OUTBOX_ENABLED:true}
      poll-delay-ms: ${PAYMENT_OUTBOX_POLL_DELAY_MS:5000}
      batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:10}
      retry-delay: ${PAYMENT_OUTBOX_RETRY_DELAY:30s}
      processing-timeout: ${PAYMENT_OUTBOX_PROCESSING_TIMEOUT:30s}
      max-attempts: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:5}
    contact-phone: ${PAYMENT_CONTACT_PHONE:+7 (383) 349-50-50}
    default-comment: ${PAYMENT_CONTACT_COMMENT:Оплата производится в день заселения у администратора отеля.}
    default-instruction: ${PAYMENT_DEFAULT_INSTRUCTION:Подтвердите бронирование. Оплата производится в день заселения у администратора.}

  kafka:
    producer:
      topics:
        payment-events: ${PAYMENT_EVENTS_TOPIC:payments-topic}
    consumer:
      topics:
        booking-events: ${BOOKING_EVENTS_TOPIC:bookings-topic}
      groups:
        booking-events: ${PAYMENT_BOOKING_EVENTS_GROUP_ID:payment-booking-events-group}
      trusted-packages: ${CONSUMER_TRUSTED_PACKAGES:*}
      retry:
        backoff-ms: ${PAYMENT_KAFKA_RETRY_BACKOFF_MS:1000}
        max-retries: ${PAYMENT_KAFKA_MAX_RETRIES:3}

  external:
    http-client:
      booking-service:
        base-url: ${BOOKING_SERVICE_BASE_URL:http://localhost:8084}
        connect-timeout: ${BOOKING_SERVICE_CONNECT_TIMEOUT:3s}
        read-timeout: ${BOOKING_SERVICE_READ_TIMEOUT:5s}
      notification-service:
        base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8088}
        connect-timeout: ${NOTIFICATION_SERVICE_CONNECT_TIMEOUT:3s}
        read-timeout: ${NOTIFICATION_SERVICE_READ_TIMEOUT:5s}

logging:
  structured:
    json:
      customizer:
        - ru.haritonenko.commonlibs.observability.PiiMaskingStructuredLoggingJsonMembersCustomizer
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
  level:
    ru.haritonenko.paymentservice: ${LOGGING_LEVEL_RU_HARITONENKO_PAYMENTSERVICE:INFO}
