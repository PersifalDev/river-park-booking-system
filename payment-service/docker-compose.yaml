services:
  payment-postgres:
    image: postgres:16
    container_name: payment-postgres
    cpus: "0.25"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    ports:
      - "${PAYMENT_DB_PORT:-5438}:5432"
    environment:
      POSTGRES_USER: ${PAYMENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: bitnami/kafka:3.8
    container_name: payment-kafka
    cpus: "1.00"
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      ALLOW_PLAINTEXT_LISTENER: yes
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s


  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    cpus: "0.65"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    depends_on:
      payment-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${PAYMENT_SERVER_PORT:-8087}:8087"
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-postgres:5432/${PAYMENT_DB_NAME}
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYMENT_SERVER_PORT: ${PAYMENT_SERVER_PORT}
      WORK_MODE: ${WORK_MODE:-ASYNC}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_LIFETIME: ${JWT_LIFETIME:-86400000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      BOOKING_EVENTS_TOPIC: ${BOOKING_EVENTS_TOPIC:-bookings-topic}
      PAYMENT_EVENTS_TOPIC: ${PAYMENT_EVENTS_TOPIC:-payments-topic}
      PAYMENT_BOOKING_EVENTS_GROUP_ID: ${PAYMENT_BOOKING_EVENTS_GROUP_ID:-payment-booking-events-group}
      BOOKING_SERVICE_BASE_URL: ${BOOKING_SERVICE_BASE_URL:-http://host.docker.internal:8084}
      NOTIFICATION_SERVICE_BASE_URL: ${NOTIFICATION_SERVICE_BASE_URL:-http://host.docker.internal:8088}
      PAYMENT_CONTACT_PHONE: ${PAYMENT_CONTACT_PHONE:-+7 (383) 349-50-50}
      PAYMENT_CONTACT_COMMENT: ${PAYMENT_CONTACT_COMMENT:-Оплата производится в день заселения у администратора отеля.}
      PAYMENT_DEFAULT_INSTRUCTION: ${PAYMENT_DEFAULT_INSTRUCTION:-Подтвердите бронирование в Telegram. Оплата производится в день заселения у администратора.}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -XX:ActiveProcessorCount=1 -XX:+UseSerialGC}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
