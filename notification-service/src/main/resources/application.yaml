spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5439/notification_db}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_HOST_PORT:9094}}

server:
  port: ${NOTIFICATION_SERVER_PORT:8088}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

openapi:
  title: River Park Notification Service API
  description: "Notification API for River Park: list, unread notifications and mark as read."
  version: 1.0.0
  security-scheme-name: bearerAuth

jwt:
  secret-key: ${JWT_SECRET_KEY:river-park-local-dev-secret-key-32}
  lifetime: ${JWT_LIFETIME:86400000}
  refresh-lifetime: ${JWT_REFRESH_LIFETIME:2592000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}

app:
  security:
    internal-service:
      token: ${INTERNAL_SERVICE_TOKEN:}
  data-retention:
    read-notifications: ${NOTIFICATION_READ_RETENTION:365d}
    unread-notifications: ${NOTIFICATION_UNREAD_RETENTION:1095d}
  notification:
    default-page-size: ${NOTIFICATION_DEFAULT_PAGE_SIZE:10}
    default-page-number: ${NOTIFICATION_DEFAULT_PAGE_NUMBER:0}
    texts:
      booking:
        date-time-pattern: '${BOOKING_NOTIFICATION_DATE_TIME_PATTERN:dd.MM.yyyy HH:mm}'
        created:
          title: '${BOOKING_NOTIFICATION_CREATED_TITLE:Заявка создана}'
          message: '${BOOKING_NOTIFICATION_CREATED_MESSAGE:Заявка %s создана и передана в обработку.}'
        hold-created:
          title: '${BOOKING_NOTIFICATION_HOLD_CREATED_TITLE:Бронь удержана}'
          message: '${BOOKING_NOTIFICATION_HOLD_CREATED_MESSAGE:Бронь %s удержана%s. Подтвердите бронирование в боте. Оплата производится при заселении у администратора.}'
        confirmed:
          title: '${BOOKING_NOTIFICATION_CONFIRMED_TITLE:Бронь подтверждена}'
          message: '${BOOKING_NOTIFICATION_CONFIRMED_MESSAGE:Бронь %s подтверждена. Оплата производится в день заезда у администратора отеля River Park.}'
        cancelled:
          title: '${BOOKING_NOTIFICATION_CANCELLED_TITLE:Бронь отменена}'
          message: '${BOOKING_NOTIFICATION_CANCELLED_MESSAGE:Бронь %s отменена.}'
        expired:
          title: '${BOOKING_NOTIFICATION_EXPIRED_TITLE:Удержание истекло}'
          message: '${BOOKING_NOTIFICATION_EXPIRED_MESSAGE:Удержание по брони %s истекло. Бронь отменена автоматически.}'
        failed:
          title: '${BOOKING_NOTIFICATION_FAILED_TITLE:Ошибка бронирования}'
          message: '${BOOKING_NOTIFICATION_FAILED_MESSAGE:Во время создания брони %s произошла ошибка.}'
          message-with-reason: '${BOOKING_NOTIFICATION_FAILED_MESSAGE_WITH_REASON:Во время создания брони %s произошла ошибка. %s}'
      payment:
        unknown-amount: '${PAYMENT_NOTIFICATION_UNKNOWN_AMOUNT:уточняется}'
        invoice-created:
          title: '${PAYMENT_NOTIFICATION_INVOICE_CREATED_TITLE:Инструкция по бронированию}'
          message: '${PAYMENT_NOTIFICATION_INVOICE_CREATED_MESSAGE:Сумма проживания рассчитана: %s. Подтвердите намерение приехать. Оплата производится при заселении у администратора.}'
        pending:
          title: '${PAYMENT_NOTIFICATION_PENDING_TITLE:Ожидается подтверждение}'
          message: '${PAYMENT_NOTIFICATION_PENDING_MESSAGE:Сумма проживания: %s. Нажмите подтверждение в боте, чтобы зафиксировать бронирование.}'
        confirmed:
          title: '${PAYMENT_NOTIFICATION_CONFIRMED_TITLE:Подтверждение получено}'
          message: '${PAYMENT_NOTIFICATION_CONFIRMED_MESSAGE:Подтверждение намерения оплатить на месте получено. Ожидайте итогового подтверждения брони.}'
        cancelled:
          title: '${PAYMENT_NOTIFICATION_CANCELLED_TITLE:Подтверждение отменено}'
          message: '${PAYMENT_NOTIFICATION_CANCELLED_MESSAGE:Подтверждение оплаты на месте было отменено.}'
        failed:
          title: '${PAYMENT_NOTIFICATION_FAILED_TITLE:Ошибка подтверждения}'
          message: '${PAYMENT_NOTIFICATION_FAILED_MESSAGE:Во время обработки подтверждения возникла ошибка.}'
  kafka:
    consumer:
      topics:
        payment-events: ${PAYMENT_EVENTS_TOPIC:payments-topic}
        booking-events: ${BOOKING_EVENTS_TOPIC:bookings-topic}
        notification-events: ${NOTIFICATION_EVENTS_TOPIC:notifications-topic}
      groups:
        payment-events: ${PAYMENT_EVENTS_GROUP_ID:notification-payment-events-group}
        booking-events: ${BOOKING_EVENTS_GROUP_ID:notification-booking-events-group}
        notification-events: ${NOTIFICATION_EVENTS_GROUP_ID:notification-direct-events-group}
      trusted-packages: ${CONSUMER_TRUSTED_PACKAGES:*}

logging:
  structured:
    json:
      customizer:
        - ru.haritonenko.commonlibs.observability.PiiMaskingStructuredLoggingJsonMembersCustomizer
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
  level:
    ru.haritonenko.notificationservice: ${LOGGING_LEVEL_RU_HARITONENKO_NOTIFICATIONSERVICE:INFO}
