spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5435/user_db}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    hikari:
      initialization-fail-timeout: ${USER_DB_INITIALIZATION_FAIL_TIMEOUT:-1}
      connection-timeout: ${USER_DB_CONNECTION_TIMEOUT:60000}
      validation-timeout: ${USER_DB_VALIDATION_TIMEOUT:10000}
      max-lifetime: ${USER_DB_MAX_LIFETIME:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml

server:
  port: ${USER_SERVER_PORT:8083}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

openapi:
  title: River Park User Service API
  description: "User API for River Park: registration, authentication and profile."
  version: 1.0.0
  security-scheme-name: bearerAuth

jwt:
  secret-key: ${JWT_SECRET_KEY:river-park-local-dev-secret-key-32}
  lifetime: ${JWT_LIFETIME:86400000}
  refresh-lifetime: ${JWT_REFRESH_LIFETIME:2592000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://alloy:4318/v1/metrics}
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}

app:
  security:
    internal-service:
      token: ${INTERNAL_SERVICE_TOKEN:}
  data-retention:
    refresh-token-history: ${USER_REFRESH_TOKEN_HISTORY_RETENTION:90d}
    admin-audit-log: ${USER_ADMIN_AUDIT_LOG_RETENTION:365d}
    inactive-user-data: ${USER_INACTIVE_DATA_RETENTION:1095d}
  personal-data:
    policy-version: ${PERSONAL_DATA_POLICY_VERSION:2026-06-28}
    privacy-policy-version: ${PRIVACY_POLICY_VERSION:2026-06-28}
  admin:
    capabilities-by-role:
      ADMIN:
        - USERS
        - ROLES
        - ROOM_CATEGORIES
        - ROOM_PHOTOS
        - SERVICES
        - TARIFFS
        - PROMOTIONS
        - STOP_SALES
        - MANUAL_BOOKINGS
        - BOOKING_CANCELLATIONS
        - PAYMENT_REFUNDS
        - USER_MESSAGES
      BOOKING_MANAGER:
        - MANUAL_BOOKINGS
        - BOOKING_CONFIRMATIONS
        - BOOKING_CANCELLATIONS
        - STOP_SALES
      CONTENT_MANAGER:
        - ROOM_CATEGORIES
        - ROOM_PHOTOS
        - SERVICES
        - TARIFFS
        - PROMOTIONS
      FINANCE_MANAGER:
        - PAYMENTS
        - PAYMENT_REFUNDS
      SUPPORT_MANAGER:
        - USER_MESSAGES
        - BOOKING_CANCELLATIONS
      USER: []

logging:
  structured:
    json:
      customizer:
        - ru.haritonenko.commonlibs.observability.PiiMaskingStructuredLoggingJsonMembersCustomizer
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
  level:
    ru.haritonenko.userservice: ${LOGGING_LEVEL_RU_HARITONENKO_USERSERVICE:INFO}
