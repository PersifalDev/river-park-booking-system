global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [user-service:8083, booking-service:8084, catalog-service:8085, payment-service:8087, notification-service:8088]
  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
