spring:
  application:
    name: booking-service

  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5436/booking_db}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml

  data:
    redis:
      host: ${BOOKING_SERVICE_REDIS_HOST:${CATALOG_SERVICE_REDIS_HOST:${REDIS_HOST:localhost}}}
      port: ${BOOKING_SERVICE_REDIS_PORT:${REDIS_CATALOG_SERVICE_PORT:${REDIS_PORT:6381}}}
      database: ${BOOKING_SERVICE_REDIS_DB:3}
      timeout: ${BOOKING_SERVICE_REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_HOST_PORT:9094}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${BOOKING_SERVER_PORT:8084}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

openapi:
  title: River Park Booking Service API
  description: "Booking API for River Park: create, hold, confirm, cancel, inventory, promo codes and reminders."
  version: 1.0.0
  security-scheme-name: bearerAuth

jwt:
  secret-key: ${JWT_SECRET_KEY:river-park-local-dev-secret-key-32}
  lifetime: ${JWT_LIFETIME:86400000}
  refresh-lifetime: ${JWT_REFRESH_LIFETIME:2592000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}

app:
  security:
    internal-service:
      token: ${INTERNAL_SERVICE_TOKEN:}
  data-retention:
    inactive-bookings: ${BOOKING_INACTIVE_DATA_RETENTION:1095d}
    outbox-events: ${BOOKING_OUTBOX_RETENTION:90d}
  booking:
    validation:
      date-zone: ${BOOKING_VALIDATION_DATE_ZONE:Asia/Novosibirsk}
      guests:
        min-total: ${BOOKING_MIN_TOTAL_GUESTS:1}
        max-total: ${BOOKING_MAX_TOTAL_GUESTS:6}
        min-adults: ${BOOKING_MIN_ADULTS:1}
        max-adults: ${BOOKING_MAX_ADULTS:4}
        min-children: ${BOOKING_MIN_CHILDREN:0}
        max-children: ${BOOKING_MAX_CHILDREN:5}
      price:
        min: ${BOOKING_MIN_PRICE:0.00}
        max: ${BOOKING_MAX_PRICE:1000000.00}
        fraction-digits: ${BOOKING_PRICE_FRACTION_DIGITS:2}
      area:
        min: ${BOOKING_MIN_AREA:0.00}
        max: ${BOOKING_MAX_AREA:1000.00}
        fraction-digits: ${BOOKING_AREA_FRACTION_DIGITS:2}
    cancellation:
      user-reason: '${BOOKING_CANCELLATION_USER_REASON:Отменено}'
    task:
      thread-pool-size: ${BOOKING_TASK_THREAD_POOL_SIZE:2}
      queue-capacity: ${BOOKING_TASK_QUEUE_CAPACITY:10}
      external-http-virtual-threads-enabled: ${BOOKING_EXTERNAL_HTTP_VIRTUAL_THREADS_ENABLED:true}
      max-attempts: ${BOOKING_TASK_MAX_ATTEMPTS:5}
      retry-delay: ${BOOKING_TASK_RETRY_DELAY:30s}
      scheduler-delay: ${BOOKING_TASK_SCHEDULER_DELAY:10s}
      dispatch-batch-size: ${BOOKING_TASK_BATCH_SIZE:10}
      hold-ttl: ${BOOKING_HOLD_TTL:15m}
      external-call-timeout: ${BOOKING_TASK_EXTERNAL_CALL_TIMEOUT:5s}
      initial-attempts: ${BOOKING_TASK_INITIAL_ATTEMPTS:0}
      cleanup-retention-period: ${BOOKING_CLEANUP_RETENTION_PERIOD:720h}
    hold-expiration-delay-ms: ${BOOKING_HOLD_EXPIRATION_DELAY_MS:60000}

    cleanup:
      delay-ms: ${BOOKING_CLEANUP_DELAY_MS:86400000}
    reminders:
      poll-delay-ms: ${BOOKING_REMINDERS_POLL_DELAY_MS:60000}
      hold-expiring-window: ${BOOKING_HOLD_EXPIRING_WINDOW:5m}
      check-in:
        days-before: ${BOOKING_CHECK_IN_REMINDER_DAYS_BEFORE:1}
      texts:
        date-zone: '${BOOKING_REMINDER_DATE_ZONE:Asia/Novosibirsk}'
        date-pattern: '${BOOKING_REMINDER_DATE_PATTERN:dd.MM.yyyy}'
        date-time-pattern: '${BOOKING_REMINDER_DATE_TIME_PATTERN:dd.MM.yyyy HH:mm}'
        unknown-date: '${BOOKING_REMINDER_UNKNOWN_DATE:-}'
        hold-expiring-title: '${BOOKING_HOLD_EXPIRING_NOTIFICATION_TITLE:Удержание скоро истечёт}'
        hold-expiring-message: '${BOOKING_HOLD_EXPIRING_NOTIFICATION_MESSAGE:Бронь %s удерживается до %s. Подтвердите бронь, иначе удержание будет снято автоматически.}'
        check-in-title: '${BOOKING_CHECK_IN_NOTIFICATION_TITLE:Напоминание о заезде}'
        check-in-message: '${BOOKING_CHECK_IN_NOTIFICATION_MESSAGE:Напоминаем о брони %s. Заезд запланирован на %s. Оплата производится при заселении у администратора River Park.}'
    page:
      default-size: ${BOOKING_DEFAULT_PAGE_SIZE:10}
      default-number: ${BOOKING_DEFAULT_PAGE_NUMBER:0}
      catalog-search-size: ${BOOKING_CATALOG_SEARCH_PAGE_SIZE:100}
      catalog-search-number: ${BOOKING_CATALOG_SEARCH_PAGE_NUMBER:0}
      early-completed-months-before: ${BOOKING_EARLY_COMPLETED_MONTHS_BEFORE:1}
    events:
      source: ${BOOKING_EVENT_SOURCE:booking-service}
    code:
      random-suffix-length: ${BOOKING_CODE_RANDOM_SUFFIX_LENGTH:6}
    notifications:
      review:
        title: '${BOOKING_REVIEW_NOTIFICATION_TITLE:Как прошло проживание?}'
        message: '${BOOKING_REVIEW_NOTIFICATION_MESSAGE:Спасибо, что выбрали River Park. Все понравилось? Оставьте отзыв на сайте отеля.}'
        promo-prefix: '${BOOKING_REVIEW_NOTIFICATION_PROMO_PREFIX:Ваш промокод на следующее заселение: }'
    cache:
      page-index-ttl: ${BOOKING_PAGE_INDEX_TTL:PT1H}
    lock:
      enabled: ${BOOKING_LOCK_ENABLED:true}
      wait-time: ${BOOKING_LOCK_WAIT_TIME:3s}
      lease-time: ${BOOKING_LOCK_LEASE_TIME:30s}
      retry-sleep-time: ${BOOKING_LOCK_RETRY_SLEEP_TIME:50ms}

    promo:
      generated-discount-percent: ${BOOKING_PROMO_GENERATED_DISCOUNT_PERCENT:10}
      max-generation-attempts: ${BOOKING_PROMO_MAX_GENERATION_ATTEMPTS:16}
      generated-code-random-length: ${BOOKING_PROMO_GENERATED_CODE_RANDOM_LENGTH:10}
      percent-denominator: ${BOOKING_PROMO_PERCENT_DENOMINATOR:100}
      discount-calculation-scale: ${BOOKING_PROMO_DISCOUNT_CALCULATION_SCALE:4}
      money-scale: ${BOOKING_PROMO_MONEY_SCALE:2}
      rounding-mode: ${BOOKING_PROMO_ROUNDING_MODE:HALF_UP}

    tariff:
      default-code: ${BOOKING_DEFAULT_TARIFF_CODE:ROOM_ONLY}
      money-scale: ${BOOKING_TARIFF_MONEY_SCALE:2}
      percent-denominator: ${BOOKING_TARIFF_PERCENT_DENOMINATOR:100}
      rounding-mode: ${BOOKING_TARIFF_ROUNDING_MODE:HALF_UP}

    price-calendar:
      fallback-to-category-base-price: ${BOOKING_PRICE_CALENDAR_FALLBACK_TO_CATEGORY_BASE_PRICE:true}
      money-scale: ${BOOKING_PRICE_CALENDAR_MONEY_SCALE:2}
      rounding-mode: ${BOOKING_PRICE_CALENDAR_ROUNDING_MODE:HALF_UP}

    room-inventory:
      fallback-to-category-inventory: ${BOOKING_ROOM_INVENTORY_FALLBACK_TO_CATEGORY_INVENTORY:true}

    idempotency:
      ttl: ${BOOKING_IDEMPOTENCY_TTL:24h}
      max-key-length: ${BOOKING_IDEMPOTENCY_MAX_KEY_LENGTH:128}

    rate-limit:
      enabled: ${BOOKING_RATE_LIMIT_ENABLED:true}
      window: ${BOOKING_RATE_LIMIT_WINDOW:1m}
      max-requests-per-window: ${BOOKING_RATE_LIMIT_MAX_REQUESTS_PER_WINDOW:120}
      max-create-booking-requests-per-window: ${BOOKING_RATE_LIMIT_MAX_CREATE_BOOKING_REQUESTS_PER_WINDOW:20}

    outbox:
      poll-delay-ms: ${BOOKING_OUTBOX_POLL_DELAY_MS:5000}
      batch-size: ${BOOKING_OUTBOX_BATCH_SIZE:10}
      page-number: ${BOOKING_OUTBOX_PAGE_NUMBER:0}
      retry-delay: ${BOOKING_OUTBOX_RETRY_DELAY:30s}
      max-attempts: ${BOOKING_OUTBOX_MAX_ATTEMPTS:5}

  task-execution:
    poller:
      poll-interval-ms: ${TASK_EXEC_POOL_INTERVAL_MS:15000}
      batch-size: ${TASK_EXEC_POOL_BATCH_SIZE:5}
      retry-delay: ${TASK_EXEC_POOL_RETRY_DELAY_S:30s}
      default-attempts: ${TASK_EXEC_POOL_DEFAULT_ATTEMPTS:1}



  kafka:
    producer:
      topics:
        booking-events: ${BOOKING_EVENTS_TOPIC:bookings-topic}
        notification-events: ${NOTIFICATION_EVENTS_TOPIC:notifications-topic}
    consumer:
      topics:
        payment-events: ${PAYMENT_EVENTS_TOPIC:payments-topic}
      groups:
        payment-events: ${PAYMENT_EVENTS_GROUP_ID:payment-events-group}
      trusted-packages: ${CONSUMER_TRUSTED_PACKAGES:*}

  external:
    circuit-breaker:
      enabled: ${BOOKING_EXTERNAL_CIRCUIT_BREAKER_ENABLED:true}
      failure-threshold: ${BOOKING_EXTERNAL_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      open-state-duration: ${BOOKING_EXTERNAL_CIRCUIT_BREAKER_OPEN_STATE_DURATION:30s}
    http-client:
      catalog-service:
        base-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8085}
        connect-timeout: ${CATALOG_SERVICE_CONNECT_TIMEOUT:3s}
        read-timeout: ${CATALOG_SERVICE_READ_TIMEOUT:5s}
      user-service:
        base-url: ${USER_SERVICE_BASE_URL:http://localhost:8083}
        connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT:3s}
        read-timeout: ${USER_SERVICE_READ_TIMEOUT:5s}

logging:
  structured:
    json:
      customizer:
        - ru.haritonenko.commonlibs.observability.PiiMaskingStructuredLoggingJsonMembersCustomizer
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
  level:
    ru.haritonenko.bookingservice: ${LOGGING_LEVEL_RU_HARITONENKO_BOOKINGSERVICE:WARN}
